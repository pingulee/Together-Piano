services:
  app:
    build:
      context: .
      args:
        # Next 와 소켓이 같은 오리진이므로 비워 둡니다.
        NEXT_PUBLIC_SOCKET_URL: ''
    # Cloudflare Tunnel 이 로컬로 접속하므로 외부에 직접 노출하지 않습니다.
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/app.db
    volumes:
      # 로그인 정보(SQLite)를 재배포 후에도 유지합니다.
      - piano-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  piano-data:
